name: Monitor Procesos Judiciales

on:
  schedule:
    # Lunes a viernes a las 7:30am hora Colombia (UTC-5 → 12:30 UTC)
    - cron: "30 12 * * 1-5"
  workflow_dispatch:  # Permite ejecutar manualmente desde GitHub

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar monitor
        env:
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: python monitor_procesos.py

      - name: Guardar estado actualizado
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: estado procesos actualizado"
          file_pattern: estado_procesos.json
